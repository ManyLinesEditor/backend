name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Swagger UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate docs for gateway
        working-directory: gateway
        run: swag init -g cmd/main.go

      - name: Generate docs for payment
        working-directory: payment
        run: swag init -g cmd/main.go

      - name: Generate docs for storage
        working-directory: storage
        run: swag init -g cmd/main.go

      - name: Download Swagger UI
        run: |
          npm install swagger-ui-dist
          mv node_modules/swagger-ui-dist swagger-ui-dist

      - name: Assemble site
        run: |
          mkdir -p _site/gateway _site/payment _site/storage

          cp gateway/docs/swagger.json _site/gateway/swagger.json
          cp payment/docs/swagger.json _site/payment/swagger.json
          cp storage/docs/swagger.json _site/storage/swagger.json

          for svc in gateway payment storage; do
            cp swagger-ui-dist/swagger-ui*.js  _site/$svc/
            cp swagger-ui-dist/swagger-ui*.css _site/$svc/
            cp swagger-ui-dist/favicon*.png    _site/$svc/
            sed "s/SERVICE_NAME/$svc/" scripts/swagger-template.html > _site/$svc/index.html
          done

          cp scripts/swagger-index.html _site/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4