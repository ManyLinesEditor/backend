version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      STORAGE_DB:        ${STORAGE_DB}
      PAYMENT_DB:        ${PAYMENT_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose: ["9000"]
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data

  acquiremock:
    image: askstream/acquiremock:latest
    ports:
      - "8000:8000"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      BASE_URL:       ${ACQUIREMOCK_URL}
      DATABASE_URL:   sqlite+aiosqlite:///./payment.db

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT:         ${GATEWAY_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_TTL:    ${TOKEN_TTL}
      STORAGE_URL:  http://storage-service:8081
      PAYMENT_URL:  http://payment-service:8082
    depends_on:
      postgres:
        condition: service_healthy

  storage-service:
    build:
      context: ./storage
      dockerfile: Dockerfile
    expose: ["8081"]
    environment:
      HTTP_ADDR:        ${HTTP_ADDR}
      POSTGRES_DSN:     postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${STORAGE_DB}?sslmode=${POSTGRES_SSLMODE}
      TOKEN_SECRET:     ${TOKEN_SECRET}
      TOKEN_TTL:        ${TOKEN_TTL}
      MINIO_ENDPOINT:   ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:     ${MINIO_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  payment-service:
    build:
      context: ./payment
      dockerfile: Dockerfile
    expose: ["8082"]
    environment:
      PORT:            ${PAYMENT_PORT}
      DATABASE_URL:    postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${PAYMENT_DB}?sslmode=${POSTGRES_SSLMODE}
      WEBHOOK_SECRET:  ${WEBHOOK_SECRET}
      ACQUIREMOCK_URL: ${ACQUIREMOCK_URL}
      BASE_URL:        ${BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      acquiremock:
        condition: service_started

volumes:
  pgdata:
  minio_data: